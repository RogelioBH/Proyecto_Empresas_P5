<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Power 5 - Portal de Clientes</title><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--negro:#0A0A0A;--panel:#141414;--panel2:#1c1c1c;--linea:#2a2a2a;--dorado:#C9A84C;--dorado2:#e0c878;--txt:#EDEDED;--txt2:#9a9a9a;--verde:#5BD18B;--rojo:#E2685F;--azul:#5B9BD1;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--negro);color:var(--txt);font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:24px}
header{display:flex;align-items:center;gap:18px;border-bottom:2px solid var(--dorado);padding-bottom:18px;margin-bottom:8px}
.logo{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--dorado2),var(--dorado) 60%,#9c8035);display:flex;align-items:center;justify-content:center;font-weight:800;color:#0A0A0A;font-size:20px;flex-shrink:0;box-shadow:0 0 18px rgba(201,168,76,.35)}
.htxt h1{font-size:20px;font-weight:700;letter-spacing:.3px}.htxt h1 b{color:var(--dorado)}
.htxt p{color:var(--txt2);font-size:13px;margin-top:2px}
.badge{margin-left:auto;padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:600;align-self:flex-start}
.badge.parcial{background:rgba(226,104,95,.12);border:1px solid var(--rojo);color:var(--rojo)}
.badge.completo{background:rgba(91,209,139,.12);border:1px solid var(--verde);color:var(--verde)}
.salir{margin-left:10px;background:#2a1414;color:#e88;border:1px solid #844;border-radius:8px;font-size:12px;padding:7px 12px;cursor:pointer;align-self:flex-start}
.messel{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap;align-items:center}
.messel .lb{color:var(--txt2);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-right:4px}
.messel button{background:var(--panel);border:1px solid var(--linea);color:var(--txt2);padding:7px 16px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer}
.messel button.on{background:var(--dorado);color:#0A0A0A;border-color:var(--dorado)}
nav{display:flex;gap:4px;margin:16px 0 20px;background:var(--panel);border:1px solid var(--linea);border-radius:10px;padding:5px;width:fit-content;flex-wrap:wrap}
nav button{background:transparent;border:none;color:var(--txt2);padding:9px 20px;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
nav button.active{background:var(--dorado);color:#0A0A0A}
nav button:hover:not(.active){color:var(--dorado2)}
.tab{display:none;animation:fade .3s}.tab.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.card{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:18px}
.ring-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}.ring-card canvas{max-width:150px}
.ring-lbl{color:var(--txt2);font-size:12.5px;margin-top:10px;text-transform:uppercase;letter-spacing:.5px}
.kpi .lbl{color:var(--txt2);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.kpi .val{font-size:20px;font-weight:700;margin-top:6px}.kpi .sub{font-size:11px;color:var(--txt2);margin-top:3px}
.pos{color:var(--verde)}.neg{color:var(--rojo)}.gold{color:var(--dorado)}
.sec-title{font-size:13px;color:var(--dorado);text-transform:uppercase;letter-spacing:1px;margin:26px 0 12px;font-weight:700;border-left:3px solid var(--dorado);padding-left:10px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--txt2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;border-bottom:1px solid var(--linea)}
th.r,td.r{text-align:right}
td{padding:8px 12px;border-bottom:1px solid #1f1f1f;font-size:13.2px}
tr.head td{background:#171717;color:var(--dorado);font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.5px}
tr.total td{background:#10243e;color:#fff;font-weight:700}
tr.util td{background:var(--dorado);color:#0A0A0A;font-weight:800}
tr.subt td{background:#151515;color:var(--dorado);font-weight:600;font-size:12px}
td .ind{padding-left:16px}
.chart-box{height:280px;position:relative}
.insight{background:var(--panel);border:1px solid var(--linea);border-left:3px solid var(--dorado);border-radius:10px;padding:16px 18px}
.insight h4{font-size:14px;margin-bottom:6px}.insight p{color:var(--txt2);font-size:12.8px}
.insight .big{font-size:22px;font-weight:700;color:var(--dorado);display:block;margin:4px 0}
.insight.alert{border-left-color:var(--rojo)}.insight.alert h4{color:var(--rojo)}
.insight.ok{border-left-color:var(--verde)}.insight.ok h4{color:var(--verde)}
.foot{color:#666;font-size:11px;text-align:center;margin-top:30px;border-top:1px solid var(--linea);padding-top:14px}
.gate{max-width:420px;margin:80px auto;background:var(--panel);border:1px solid var(--dorado);border-radius:14px;padding:30px;text-align:center}
.gate .logo{margin:0 auto 14px}.gate input{width:100%;background:#0A0A0A;color:#fff;border:1px solid #333;border-radius:8px;padding:11px;margin:9px 0;font-size:14px}
.btn{width:100%;background:var(--dorado);color:#0A0A0A;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
@media(max-width:900px){.g5,.g3,.g2{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap" id="app"></div>

const _hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const _h2b=h=>{const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;};

async function _dk(u,p){const pp=te.encode(norm(u)+"::"+p);const bk=await crypto.subtle.importKey('raw',pp,'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:_h2b(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},bk,256);return new Uint8Array(bits);}
async function _hmac(key,data){const k=await crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-256'},false,['sign']);return new Uint8Array(await crypto.subtle.sign('HMAC',k,data));}
async function login(){const u=document.getElementById('usr').value,p=document.getElementById('pwd').value,err=document.getElementById('gerr');err.textContent='';
 if(!u||!p){err.textContent='Ingrese usuario y clave.';return;}
 if(!(window.crypto&&window.crypto.subtle)){err.textContent='Abra el portal en un navegador moderno.';return;}
 try{const dk=await _dk(u,p);const idx=_hex(await _hmac(dk,te.encode('index')));const blob=ENC.blobs[idx];
  if(!blob){err.textContent='Usuario o clave incorrectos.';return;}
  const nonce=_h2b(blob.n),ct=_b642b(blob.c);const tag=_hex(await _hmac(dk,_cat(te.encode('auth'),nonce,ct)));
  if(tag!==blob.t){err.textContent='Usuario o clave incorrectos.';return;}
  const ks=new Uint8Array(ct.length);let off=0,c=0;
  while(off<ct.length){const blk=await _hmac(dk,_cat(nonce,_u32(c)));const n=Math.min(32,ct.length-off);ks.set(blk.subarray(0,n),off);off+=n;c++;}
  const pt=new Uint8Array(ct.length);for(let i=0;i<ct.length;i++)pt[i]=ct[i]^ks[i];
  const d=JSON.parse(td.decode(pt));DB[d.slug]=d;CUR=d.slug;SELM=null;render(d.slug);
 }catch(e){err.textContent='No se pudo validar. '+e;}}

function tabla(rows){return rows.map(r=>{

  const cls=r[0]?(' class="'+r[0]+'"'):'';const name=(r[0]===''||r[0]==='sub')?'<span class=ind>'+r[1]+'</span>':r[1];
  return '<tr'+cls+'><td>'+name+'</td>'+r.slice(2).map(c=>'<td class=r>'+c+'</td>').join('')+'</tr>';}).join('');}
function render(slug){
 destroyCharts();const app=document.getElementById('app');const d=slug?DB[slug]:null;

 let egr=Object.entries(emap).sort((a,b)=>b[1]-a[1]);const tEgr=egr.reduce((s,x)=>s+x[1],0)||1;
 const NAME=slug.replace(/_/g,' ').toUpperCase();

 const kpis='<div class="grid g5" style="margin-top:16px">'+
  '<div class="card kpi"><div class="lbl">Total ingresos</div><div class="val">'+f(ti,m)+'</div><div class="sub">Op. '+f(cur.ing,m)+' &middot; Otros '+f(cur.otr,m)+'</div></div>'+
  '<div class="card kpi"><div class="lbl">Total egresos</div><div class="val neg">'+f(tdec,m)+'</div><div class="sub">'+(ti?pc(tdec/ti):'0%')+' de los ingresos</div></div>'+

  '<div class="card kpi"><div class="lbl">Impuestos</div><div class="val">'+f(cur.imp,m)+'</div></div>'+
  '<div class="card kpi" style="border-color:var(--dorado)"><div class="lbl">Utilidad neta</div><div class="val gold">'+f(cur.un,m)+'</div><div class="sub">Margen '+pc(mn)+'</div></div></div>';
 let fr=[['th','Fuente / cuenta','Monto','%']];
 fuentes.slice(0,8).forEach(x=>fr.push(['',x[0],f(x[1],m),pc(x[1]/(ti||1))]));
 if(otrosF>1)fr.push(['','Otros ingresos (no detallados)',f(otrosF,m),pc(otrosF/(ti||1))]);
 fr.push(['total','TOTAL INGRESOS',f(ti,m),'100%']);
 let fbL=fuentes.slice(0,6).map(x=>x[0].length>14?x[0].slice(0,13)+'…':x[0]);

 if(otrosF>1){fbL=fbL.concat(['Otros']);fbD=fbD.concat([otrosF]);}
 const resumen='<div class="grid g3"><div class="card ring-card"><canvas id="r1"></canvas><div class="ring-lbl">Margen bruto</div></div>'+

 const pygRows=[['head','INGRESOS','',''],

  ['head','PAUTA Y GASTOS OPERATIVOS','',''],

  for(const t in g){let st=0;g[t].forEach((x,i)=>{st+=x[2];gt+=x[2];h+='<tr><td>'+(i===0?'<b style="color:#C9A84C">'+t+'</b>':'')+'</td><td>'+x[1]+'</td><td class=r style="'+(x[2]<0?'color:#E2685F':'')+'">'+f(x[2],m)+'</td><td style="color:#9a9a9a">'+x[3]+'</td></tr>';});h+='<tr class="subt"><td></td><td>Subtotal '+t+'</td><td class=r>'+f(st,m)+'</td><td></td></tr>';}
  detalle=h+'<tr class="total"><td></td><td>NETO MOVIMIENTOS DEL MES</td><td class=r>'+f(gt,m)+'</td><td></td></tr></table>';}
 else{detalle='<p style="color:#9a9a9a;padding:14px">El detalle de movimientos solo est&aacute; disponible para el mes m&aacute;s reciente. Para <b>'+cur.mes+'</b> se muestran los totales del P&amp;G arriba.</p>';}
 const tesoreria='<div class="grid g3" style="margin-top:16px"><div class="card kpi"><div class="lbl">IO Cash / recargas</div><div class="val" style="color:var(--azul)">'+f(d.io||0,m)+'</div></div><div class="card kpi"><div class="lbl">Retiros socio</div><div class="val" style="color:var(--azul)">'+f(d.ret||0,m)+'</div></div><div class="card kpi"><div class="lbl">% Devoluci&oacute;n</div><div class="val">'+pc(pdv)+'</div></div></div>';
 const mesT='<div class="sec-title">Estado de resultados &middot; '+cur.mes+'</div><div class="card" style="padding:6px 0"><table>'+tabla(pygRows)+'</table></div>'+tesoreria+
  '<div class="sec-title">Detalle de movimientos &middot; '+cur.mes+'</div><div class="card" style="padding:6px 0">'+detalle+'</div>'+
  '<div class="sec-title">Desglose de egresos por categor&iacute;a</div><div class="grid g2"><div class="card"><div class="chart-box"><canvas id="expBar"></canvas></div></div><div class="card"><table>'+tabla(er)+'</table></div></div>';
 let consHead=['th','Concepto'].concat(men.map(x=>x.mes)).concat(['ACUM']);
 const lineas=[['Ingresos totales',x=>x.ing+x.otr],['Utilidad bruta',x=>x.ing+x.otr-x.cos],['Pauta digital',x=>x.pau],['Gastos admin.',x=>x.adm],['Utilidad operacional',x=>x.ing+x.otr-x.cos-x.pau-x.adm,'total'],['Gastos no operac.',x=>x.nop],['Impuestos',x=>x.imp],['UTILIDAD NETA',x=>x.un,'util']];
 let consRows=[consHead];
 lineas.forEach(L=>{const fn=L[1];const vals=men.map(x=>f(fn(x),m));const ac=f(men.reduce((s,x)=>s+fn(x),0),m);consRows.push([L[2]||''].concat([L[0]]).concat(vals).concat([ac]));});
 const consol='<div class="sec-title">Evoluci&oacute;n mensual</div><div class="card"><div class="chart-box"><canvas id="trendC"></canvas></div></div><div class="sec-title">Consolidado mensual (todos los meses)</div><div class="card" style="padding:6px 0"><table>'+tabla(consRows)+'</table></div>';
 const ins=[];
 if(fuentes[0])ins.push(['','La fuente que m&aacute;s aporta','<span class="big">'+pc(fuentes[0][1]/(ti||1))+'</span>','<b>'+fuentes[0][0]+'</b> genera '+f(fuentes[0][1],m)+' del ingreso de '+cur.mes+'.']);
 ins.push([mn>=0?'ok':'alert','Margen neto de '+cur.mes,'<span class="big">'+pc(mn)+'</span>','Utilidad neta '+f(cur.un,m)+' sobre ingresos de '+f(ti,m)+'.']);
 if(egr[0])ins.push(['','Principal gasto','<span class="big">'+f(egr[0][1],m)+'</span>','<b>'+egr[0][0]+'</b> &mdash; '+pc(egr[0][1]/tEgr)+' del total de egresos.']);
 let insHtml=ins.map(x=>'<div class="insight '+x[0]+'"><h4>'+x[1]+'</h4>'+x[2]+'<p>'+x[3]+'</p></div>').join('');
 let pend=(d.fa&&d.fa.length)?d.fa.map(x=>'<div class="insight alert"><h4>&#9888; Pendiente</h4><p>'+x+'</p></div>').join(''):'<div class="insight ok"><h4>&#10003; Sin pendientes</h4><p>El cierre del per&iacute;odo no tiene items pendientes registrados.</p></div>';
 let propios=(d.co&&d.co.length)?'<div class="sec-title">Conceptos propios del cliente</div><div class="card"><ul style="list-style:none">'+d.co.map(x=>'<li style="padding:5px 0;border-bottom:1px solid #1f1f1f;color:#cfcfcf">&bull; '+x+'</li>').join('')+'</ul></div>':'';
 const analisis='<div class="sec-title">Factores clave &middot; '+cur.mes+'</div><div class="grid g3">'+insHtml+'</div><div class="sec-title">Alertas y pendientes</div><div class="grid g2">'+pend+'</div>'+propios;
 app.innerHTML='<header><div class="logo">P5</div><div class="htxt"><h1><b>Power 5</b> &middot; '+NAME+'</h1><p>Estado de resultados &middot; '+cur.mes+' &middot; '+(d.multi?'Multimoneda '+d.mon:'Moneda '+d.mon)+(d.ct?(' &middot; '+d.ct):'')+'</p></div>'+badge+'<button class="salir" onclick="salir()">Salir</button></header>'+
  selector+
  '<nav><button class="active" data-t="resumen">Resumen</button><button data-t="mes">Mes actual</button><button data-t="consol">Consolidado</button><button data-t="analisis">An&aacute;lisis</button></nav>'+
  '<div class="tab active" id="resumen">'+resumen+'</div><div class="tab" id="mes">'+mesT+'</div><div class="tab" id="consol">'+consol+'</div><div class="tab" id="analisis">'+analisis+'</div>'+
  '<div class="foot">Power 5 &middot; PowerCommerce SAS &middot; Confidencial &mdash; uso exclusivo de '+NAME+'</div>';
 ring('r1',Math.round(mb*1000)/10,G);ring('r2',Math.round(mn*1000)/10,mn>=0?GREEN:RED);ring('r3',Math.round(pdv*1000)/10,pdv>0?RED:'#555');
 bars('srcBar',fbL,fbD,PAL.slice(0,fbL.length),false,m);
 bars('expBar',egr.slice(0,8).map(x=>x[0].length>16?x[0].slice(0,15)+'…':x[0]),egr.slice(0,8).map(x=>x[1]),G,true,m);
 trend('trendC',men.map(x=>x.mes),men.map(x=>x.ing+x.otr),men.map(x=>x.cos+x.pau+x.adm+x.nop+x.imp),men.map(x=>x.un),m);
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));

  setTimeout(()=>CHARTS.forEach(c=>{try{c.resize();}catch(e){}}),30);});
}
render(null);
</script></body></html>
